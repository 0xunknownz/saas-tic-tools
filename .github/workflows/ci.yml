name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Foundation source is currently public. Keep an optional credential for private deployments;
# GitHub Packages authentication is configured separately in the frontend job (docs/ci.md).
env:
  GOPRIVATE: github.com/0xunknownz/*
  FOUNDATION_READ_TOKEN: ${{ secrets.FOUNDATION_READ_TOKEN }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: Configure optional Foundation source authentication
        run: |
          if [ -n "$FOUNDATION_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${FOUNDATION_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "Using anonymous access to the public Foundation source repository."
          fi
      - name: Build
        working-directory: apps/api
        run: go build ./...
      - name: Test
        working-directory: apps/api
        run: go vet ./... && go test ./...

  # Security test suite (technical design 17.10, PRD M-006 / AC-026): generate the cases from
  # the OpenAPI contracts, run them against the real API on PostgreSQL, and write the result
  # into the Release Manifest. A FAIL, an INVALID baseline or an undeclared operation fails
  # this job: a wrong fixture must never be mistaken for "access denied".
  # The fixture covers the modules this product enables (see scripts/security/README.md);
  # an operation whose module is off is not mounted and must be marked "skip" with a reason.
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      # The suite reads one-time credentials (activation and invitation links) from the
      # notification outbox, which the API seals with SECRETS_KEY. CI uses a fixed key.
      SECRETS_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      API_BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # apps/api/go.mod pins the Foundation module and the CLI in one version; `go tool saasctl`
          # builds exactly that version, so no separate install step and no version variable.
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: Configure optional Foundation source authentication
        run: |
          if [ -n "$FOUNDATION_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${FOUNDATION_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "Using anonymous access to the public Foundation source repository."
          fi
      - name: Generate ignored contracts and verify tracked wiring
        run: |
          go tool saasctl generate
          git diff --exit-code
      - name: Migrate the database
        run: go tool saasctl db migrate --yes
      - name: Install a signed CI test license
        working-directory: apps/api
        run: go run ./cmd/ci-license
        env:
          APP_ENV: development
      - name: Start the API
        working-directory: apps/api
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          mkdir -p "$RUNNER_TEMP/storage"
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for _ in $(seq 1 100); do
            if curl -fsS "$API_BASE/readyz" > /dev/null; then exit 0; fi
            sleep 0.2
          done
          echo "the API never became ready"; cat "$RUNNER_TEMP/api.log"; exit 1
        env:
          APP_ENV: development
          HTTP_ADDR: 127.0.0.1:8080
          STORAGE_LOCAL_ROOT: ${{ runner.temp }}/storage
      - name: Security test suite
        run: |
          go tool saasctl security suite \
            --api "$API_BASE" \
            --openapi apps/api/openapi \
            --fixture scripts/security/fixture.json \
            --out scripts/security/report.json
      - name: Record the result in the Release Manifest
        run: go tool saasctl build --security-result scripts/security/report.json
      - name: Upload the security result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-suite-report
          path: |
            scripts/security/report.json
            release/manifest.json
          if-no-files-found: warn
      - name: Stop the API
        if: always()
        working-directory: apps/api
        run: |
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" || true; fi
          cat "$RUNNER_TEMP/api.log" || true

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # GITHUB_TOKEN can read public packages or packages granting this repository Actions access.
      # A classic PAT with read:packages is only needed when that access is unavailable.
      NODE_AUTH_TOKEN: ${{ secrets.FOUNDATION_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Authenticate to GitHub Packages
        run: |
          # pnpm 10 only expands credential variables from trusted user configuration.
          # Keep the token in the environment instead of writing its value to disk.
          umask 077
          npm_user_config="$RUNNER_TEMP/foundation.npmrc"
          # shellcheck disable=SC2016 # pnpm expands this reference when it reads the trusted file.
          printf '@0xunknownz:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$npm_user_config"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$npm_user_config" >> "$GITHUB_ENV"
          if [ -z "$FOUNDATION_READ_TOKEN" ]; then
            echo "Using GITHUB_TOKEN with packages:read. If package access is denied, follow docs/ci.md."
          fi
      - run: pnpm install --frozen-lockfile
      # Build first: TanStack Router writes src/routeTree.gen.ts during the build, which typecheck needs.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
