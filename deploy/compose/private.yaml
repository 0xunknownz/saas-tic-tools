# Private single-host deployment candidate. Images must be preloaded and pinned
# to the release manifest; no build or image pull occurs on the customer host.
# The edge binds loopback and requires a separately managed TLS reverse proxy.
name: ${COMPOSE_PROJECT_NAME:-saas-tic-tools-private}

x-app-env: &app-env
  APP_ENV: production
  HTTP_ADDR: ":8080"
  DATABASE_URL: "${DATABASE_URL:?set protected DATABASE_URL}"
  SECRETS_KEY: "${SECRETS_KEY:?set protected SECRETS_KEY}"
  STORAGE_PROVIDER: s3-compatible
  S3_ENDPOINT: "${S3_ENDPOINT:?set private S3 endpoint}"
  S3_REGION: "${S3_REGION:?set S3 region}"
  S3_BUCKET: "${S3_BUCKET:?set S3 bucket}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?set protected S3 access key}"
  S3_ACCESS_KEY_SECRET: "${S3_ACCESS_KEY_SECRET:?set protected S3 secret}"
  S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
  NOTIFICATION_PROVIDER: "${NOTIFICATION_PROVIDER:-disabled}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_FROM: "${SMTP_FROM:-}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  WEB_PUBLIC_URL: "${WEB_PUBLIC_URL:?set HTTPS public URL}"
  ADMIN_PUBLIC_URL: "${ADMIN_PUBLIC_URL:?set HTTPS admin URL}"
  TENANT_SELF_SIGNUP: "${TENANT_SELF_SIGNUP:-false}"
  TENANT_SELF_SERVICE_CREATE: "${TENANT_SELF_SERVICE_CREATE:-false}"

services:
  postgres:
    image: "${POSTGRES_IMAGE:?set preloaded PostgreSQL image}"
    pull_policy: never
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    image: "${API_IMAGE:?set preloaded API image}"
    pull_policy: never
    command: ["/app/migrate", "-plan", "/app/migrations/plan.json"]
    volumes:
      - type: bind
        source: ../../release/migrations/plan.json
        target: /app/migrations/plan.json
        read_only: true
        bind: {create_host_path: false}
    environment:
      DATABASE_URL: "${DATABASE_URL:?set protected DATABASE_URL}"
      MIGRATE_ON_START: "false"
      MIGRATION_LOCK_TIMEOUT: "${MIGRATION_LOCK_TIMEOUT:-30s}"
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    image: "${API_IMAGE:?set preloaded API image}"
    pull_policy: never
    command: ["/app/api"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped
  worker:
    image: "${API_IMAGE:?set preloaded API image}"
    pull_policy: never
    command: ["/app/worker"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    image: "${WEB_IMAGE:?set preloaded Web image}"
    pull_policy: never
    environment: {NODE_ENV: production, PORT: "3000", HOST: 0.0.0.0}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  edge:
    image: "${EDGE_IMAGE:?set preloaded edge image}"
    pull_policy: never
    ports: ["127.0.0.1:${EDGE_PORT:-8080}:8080"]
    volumes:
      - "../private/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
volumes:
  pgdata:
secrets:
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:?set protected password file path}"
