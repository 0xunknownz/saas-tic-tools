# Test-environment edge routing (technical design 11.15, 14.2).
# Serves the Admin SPA under /admin/, proxies the API and the TanStack Start Web.
#
# Request tracing (TRACE-05): every request gets one id, shared by the edge access log, the API
# access log and the response. A well-formed inbound id from an outer proxy is reused, otherwise
# nginx generates one. The id is a correlation key only, never a credential.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format trace '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" rid=$req_id rt=$request_time';

server {
    listen 8080;
    server_name _;
    client_max_body_size 110m;
    access_log /var/log/nginx/access.log trace;

    # The Admin SPA is built with base /admin/.
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $req_id always;
    }
    location = /admin {
        return 308 /admin/;
    }

    # Tenant admin SPA (members, billing) on the same host as web, under /console/ (design 4.1).
    location /console/ {
        alias /usr/share/nginx/html/console/;
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $req_id always;
    }
    location = /console {
        return 308 /console/;
    }

    # Controlled file downloads (11.15): never buffer the response in the proxy.
    # The API also sends "X-Accel-Buffering: no"; the explicit location makes the requirement
    # independent of the application header and keeps Range requests streaming.
    location ~ ^/api/tenant/v1/files/[^/]+(/content)?$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Proxy-Buffering off always;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;
    }
    location = /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $req_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;
    }
    location = /readyz {
        proxy_pass http://api:8080/readyz;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $req_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;
    }

    # Product Web (TanStack Start SSR).
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;
    }
}
