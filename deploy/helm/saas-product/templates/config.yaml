apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-config
  labels:
    {{- include "saas-product.labels" . | nindent 4 }}
data:
  APP_ENV: production
  HTTP_ADDR: ":8080"
  STORAGE_PROVIDER: {{ .Values.config.storageProvider | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.config.s3ForcePathStyle | quote }}
  NOTIFICATION_PROVIDER: {{ .Values.config.notificationProvider | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_FROM: {{ .Values.config.smtpFrom | quote }}
  WEB_PUBLIC_URL: {{ .Values.config.webPublicURL | quote }}
  ADMIN_PUBLIC_URL: {{ .Values.config.adminPublicURL | quote }}
  TENANT_SELF_SIGNUP: {{ .Values.config.tenantSelfSignup | quote }}
  TENANT_SELF_SERVICE_CREATE: {{ .Values.config.tenantSelfServiceCreate | quote }}
  IDENTITY_PROVIDERS: {{ .Values.config.identityProviders | quote }}
