{{- range $name := list "api" "web" "edge" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "saas-product.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ if eq $name "web" }}3000{{ else }}8080{{ end }}
      targetPort: http
  selector:
    {{- include "saas-product.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "saas-product.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
  selector:
    {{- include "saas-product.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
